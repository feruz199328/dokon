<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ustoz Do'koni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: telefon uchun bitta ustunli katalog — yopishqoq sarlavha, toifa chiplari, 2 ustunli kartochkalar, pastdan ochiladigan tovar oynasi */
:root{
  --paper:#F6F7F9;      /* oq doska */
  --card:#FFFFFF;
  --ink:#16203A;        /* marker siyohi */
  --muted:#5D6680;
  --line:#DCE0EA;
  --blue:#1D4ED8;       /* ko'k marker — asosiy */
  --blue-ink:#FFFFFF;
  --red:#D7263D;        /* qizil marker — narx, belgi */
  --green:#0F8A5F;      /* yashil marker — Uzum, bepul */
  --tile:#E8EDFB;
  --sheet-shade:rgba(10,15,30,.45);
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1424;--card:#171E33;--ink:#EEF1F8;--muted:#9AA3BC;--line:#28314B;
  --blue:#6E95FF;--blue-ink:#0B1020;--red:#FF6B7D;--green:#3CCB92;--tile:#1F2944;--sheet-shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1424;--card:#171E33;--ink:#EEF1F8;--muted:#9AA3BC;--line:#28314B;
  --blue:#6E95FF;--blue-ink:#0B1020;--red:#FF6B7D;--green:#3CCB92;--tile:#1F2944;--sheet-shade:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0;outline:none}
.search:focus-within{border-color:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 13px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible,.sort:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.note{margin-top:14px;display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px dashed var(--green);border-radius:12px;padding:10px 12px;font-size:13.5px}
.note b{color:var(--green)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 10px}
.bar .count{color:var(--muted);font-size:13px}
.sort{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:6px 8px;border-radius:8px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{border-color:var(--blue)}
.tile{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.tile svg{width:44%;height:auto;color:var(--blue)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .en{position:absolute;left:8px;bottom:8px;font:700 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--card);padding:3px 6px;border-radius:5px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tag{position:absolute;right:8px;top:8px;font:600 11px var(--body);color:#fff;background:var(--red);padding:3px 7px;border-radius:6px}
.body{padding:10px 12px 12px;display:grid;gap:4px;flex:1;min-width:0}
.name{font-weight:600;font-size:14.5px;line-height:1.3;text-wrap:balance}
.for{color:var(--muted);font-size:12.5px}
.price{margin-top:auto;padding-top:6px;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--ink)}
.price small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

.shade{position:fixed;inset:0;background:var(--sheet-shade);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:88%;overflow-y:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-width:760px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet .tile{border-radius:12px;aspect-ratio:16/9}
.sheet h2{font-family:var(--display);font-weight:800;font-size:22px;margin:14px 0 2px;line-height:1.15;text-wrap:balance}
.sheet .bigprice{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;margin:6px 0 10px}
.sheet p{margin:0 0 10px;max-width:65ch}
.sheet ul{margin:0 0 14px;padding-left:18px;display:grid;gap:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.meta span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
.actions{display:grid;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font:600 15px var(--body);padding:13px 14px;border-radius:12px;border:1px solid transparent;cursor:pointer}
.btn.uzum{background:var(--green);color:#fff}
.btn.tg{background:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px}
footer{margin-top:28px;color:var(--muted);font-size:12.5px;text-align:center}

/* --- savat va buyurtma --- */
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cartbtn{position:relative;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.cartbtn:focus-visible,.qbtn:focus-visible,.cartbar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font:600 11.5px/20px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.incart{position:absolute;left:8px;top:8px;font:600 11px var(--body);color:#fff;background:var(--green);padding:3px 7px;border-radius:6px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--paper) 70%,transparent)}
.cartbar button{width:100%;max-width:728px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-radius:14px;background:var(--blue);color:var(--blue-ink);font:600 15px var(--body);padding:14px 16px;cursor:pointer}
.cartbar button span:last-child{font-variant-numeric:tabular-nums}
body.has-cart .wrap{padding-bottom:96px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qbtn{width:36px;height:36px;border:0;background:var(--card);color:var(--ink);font:600 18px var(--body);cursor:pointer}
.qty output{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:8px;align-items:stretch}
.addrow .btn{flex:1}
.lines{display:grid;gap:10px;margin:6px 0 14px}
.line{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.line .mini{width:52px;height:52px;border-radius:10px;background:var(--tile);display:grid;place-items:center;color:var(--blue)}
.line .mini svg{width:30px}
.line .ln{font-weight:600;font-size:14px;line-height:1.25}
.line .lp{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:6px;background:var(--paper);border-radius:12px;padding:12px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .total{font-family:var(--display);font-weight:800;font-size:20px;border-top:1px solid var(--line);padding-top:8px}
.sum small{color:var(--muted)}
form.co{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.radios{display:grid;gap:6px}
.radios label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500;cursor:pointer}
.radios input{margin-top:3px}
.err{color:var(--red);font-size:13px}
.msg{white-space:pre-wrap;background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13.5px;margin-bottom:12px;user-select:all}
.done{font-family:var(--display);font-weight:800;font-size:22px;margin:10px 0 4px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:20px;margin:8px 0 10px}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">

  <div class="note"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="flex:none;color:var(--green);margin-top:1px"><path d="M2 6h12v10H2zM14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><div>Barcha tovarlar <a id="uzumNote" href="https://uzum.uz/uz/shop/ustozdokoni" target="_blank" rel="noopener" style="color:var(--green);font-weight:600">Uzum'dagi do'konimizda</a> sotiladi: topshirish punktigacha yetkazish <b>bepul</b>, Uzum Nasiya bilan bo'lib to'lash mumkin.</div></div>

</div>

<div class="shade" id="shade" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle"></section>

  {id:"bpen",  cat:"logo", type:"order", pop:17, name:"Logoli ruchka (10 dona)", en:"Custom pens", price:45000, for:"O'quv markazlari", unit:"10 dona",
   desc:"Markazingiz nomi yozilgan ruchkalar — har bir o'quvchi qo'lida reklama.", points:["10 dona to'plam narxi","Rangini tanlash mumkin","Ochiq eshiklar kuni uchun"], uzum:"", img:""},
  {id:"key",   cat:"logo", type:"order", pop:18, name:"Logoli brelok", en:"Custom keychain", price:15000, for:"O'quv markazlari", unit:"dona",
   desc:"Bitiruvchilar va yaxshi o'quvchilar uchun esdalik sovg'a.", points:["Metall yoki akril","Logo va yozuv bilan","Katta partiyada arzonroq"], uzum:"", img:""}
];

const CATS = [
  {id:"all", name:"Hammasi"},
  {id:"cards", name:"Kartochkalar"},
  {id:"games", name:"O'yinlar"},
  {id:"boards", name:"Doskalar"},
  {id:"audio", name:"Texnika"},
  {id:"stationery", name:"Shtamplar"},
  {id:"logo", name:"Logo bilan buyurtma"}
];
/* ======================================================================== */

const ICONS = {
  audio:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 26h10l14-11v34L20 38H10z" fill="currentColor" fill-opacity=".12"/><path d="M42 24c3 3 3 13 0 16M48 18c7 7 7 21 0 28"/></svg>',
  cards:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><rect x="8" y="16" width="30" height="38" rx="4" transform="rotate(-8 23 35)" fill="currentColor" fill-opacity=".12"/><rect x="26" y="10" width="30" height="38" rx="4"/><path d="M34 34l7-16 7 16M36.5 28h9" stroke-linecap="round"/></svg>',
  games:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><rect x="10" y="22" width="26" height="26" rx="5" fill="currentColor" fill-opacity=".12"/><rect x="30" y="12" width="24" height="24" rx="5" transform="rotate(12 42 24)"/><circle cx="18" cy="30" r="2.5" fill="currentColor"/><circle cx="28" cy="40" r="2.5" fill="currentColor"/><circle cx="42" cy="24" r="2.5" fill="currentColor"/></svg>',
  boards:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="12" width="48" height="32" rx="3" fill="currentColor" fill-opacity=".12"/><path d="M16 24h18M16 32h26M24 44l-4 10M40 44l4 10"/></svg>',
  stationery:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M26 8h12v14l8 6v8H18v-8l8-6z" fill="currentColor" fill-opacity=".12"/><rect x="12" y="36" width="40" height="8" rx="2"/><path d="M16 54h32" stroke-linecap="round"/></svg>',
  logo:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M22 8 8 18l6 10 6-3v31h24V25l6 3 6-10L42 8c-2 5-6 7-10 7s-8-2-10-7z" fill="currentColor" fill-opacity=".12"/><circle cx="32" cy="34" r="6"/></svg>'
};

const fmt = n => n.toLocaleString("ru-RU").replace(/ /g," ");
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

document.getElementById("shopName").textContent = CONFIG.shopName;
document.getElementById("shopTag").textContent = CONFIG.tagline;
document.getElementById("foot").textContent = "Savollar bo'yicha: @" + CONFIG.telegramAdmin + " · Narxlar Uzum Market'dagi narxlar";

let state = {cat:"all", q:"", sort:"pop"};
try { const s = JSON.parse(localStorage.getItem("ustoz-ui")||"{}"); if (s.cat) state.cat = s.cat; if (s.sort) state.sort = s.sort; } catch(e){}
document.getElementById("sort").value = state.sort;

const chips = document.getElementById("chips");
CATS.forEach(c => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = c.name; b.dataset.id = c.id; b.id = "chip-" + c.id;
  b.addEventListener("click", () => { state.cat = c.id; save(); render(); });
  chips.appendChild(b);
});

function save(){ try { localStorage.setItem("ustoz-ui", JSON.stringify({cat:state.cat, sort:state.sort})); } catch(e){} }

function tileHTML(p){
  const art = p.img ? `<img src="${p.img}" alt="${p.name}">` : ICONS[p.cat] || ICONS.cards;
  return `<div class="tile">${art}<span class="en">${p.en}</span>${p.tag ? `<span class="tag">${p.tag}</span>` : ""}</div>`;
}

function render(){
  chips.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === state.cat ? "true" : "false"));
  const q = state.q.trim().toLowerCase();
  let list = PRODUCTS.filter(p => (state.cat === "all" || p.cat === state.cat) &&
    (!q || (p.name + " " + p.en + " " + p.for + " " + p.desc).toLowerCase().includes(q)));
  if (state.sort === "asc") list.sort((a,b) => a.price - b.price);
  else if (state.sort === "desc") list.sort((a,b) => b.price - a.price);
  else list.sort((a,b) => a.pop - b.pop);
  document.getElementById("count").textContent = list.length + " ta tovar";
  const grid = document.getElementById("grid");
  if (!list.length) { grid.innerHTML = `<div class="empty">Hech narsa topilmadi. Boshqa so'z bilan qidiring.</div>`; return; }
  grid.innerHTML = list.map(p => `
    <button class="card" type="button" data-id="${p.id}" id="card-${p.id}">
      ${tileHTML(p)}
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="for">${p.for}</div>
        <div class="price">${p.type === "order" ? `<small>dan </small>` : ""}${fmt(p.price)} <small>so'm${p.unit ? " / " + p.unit : ""}</small></div>
      </div>
    </button>`).join("");
  grid.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => open(c.dataset.id)));
}

const sheet = document.getElementById("sheet"), shade = document.getElementById("shade");
let lastFocus = null;
function tgLink(text){ return "https://t.me/" + CONFIG.telegramAdmin + (text ? "?text=" + encodeURIComponent(text) : ""); }

function open(id){
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  lastFocus = document.activeElement;
  let actions;
  if (p.type === "order") {
    actions = `<a class="btn tg" href="${tgLink(`Assalomu alaykum! "${p.name}" buyurtma qilmoqchiman. Soni: __ ta. Logomizni yuboraman.`)}" target="_blank" rel="noopener" id="ask">Buyurtma berish (Telegram)</a>`;
  } else if (p.uzum) {
    actions = `<a class="btn uzum" href="${p.uzum}" target="_blank" rel="noopener" id="buy">Uzum'da sotib olish</a>
      <a class="btn ghost" href="${tgLink(`Assalomu alaykum! "${p.name}" haqida savolim bor.`)}" target="_blank" rel="noopener" id="ask">Savol berish (Telegram)</a>`;
  } else {
    actions = `<span class="btn uzum" aria-disabled="true">Tez orada Uzum'da</span>
      <a class="btn tg" href="${tgLink(`Assalomu alaykum! "${p.name}" Uzum'ga chiqqanda xabar bering, olmoqchiman.`)}" target="_blank" rel="noopener" id="ask">Chiqqanda menga xabar bering</a>`;
  }
  sheet.innerHTML = `
    <div class="grab" aria-hidden="true"></div>
    ${tileHTML(p)}
    <h2 id="sTitle">${p.name}</h2>
    <div class="bigprice">${p.type === "order" ? "dan " : ""}${fmt(p.price)} so'm${p.unit ? " / " + p.unit : ""}</div>
    <div class="meta"><span>${p.for}</span><span>${p.en}</span>${p.type === "order" ? "<span>Logo bilan buyurtma</span>" : "<span>Uzum: bepul yetkazish</span><span>Nasiya mumkin</span>"}</div>
    <p>${p.desc}</p>
    <ul>${p.points.map(x => `<li>${x}</li>`).join("")}</ul>
    <div class="actions">${actions}<button class="btn ghost" type="button" id="close">Yopish</button></div>
    ${p.type !== "order" && !p.uzum ? `<div class="hint">Tovar Uzum'ga chiqishi bilan shu yerda «Uzum'da sotib olish» tugmasi paydo bo'ladi.</div>` : ""}`;
  sheet.hidden = false; shade.hidden = false;
  document.getElementById("close").addEventListener("click", close);
  if (tg && tg.openLink) {
    sheet.querySelectorAll('a[href^="http"]').forEach(a => a.addEventListener("click", e => {
      e.preventDefault();
      if (a.href.startsWith("https://t.me/") && tg.openTelegramLink) tg.openTelegramLink(a.href); else tg.openLink(a.href);
    }));
  }
  document.getElementById("close").focus();
}
function close(){ sheet.hidden = true; shade.hidden = true; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
shade.addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) close(); });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; save(); render(); });
const ub = document.getElementById("uzumShopBtn");
const un = document.getElementById("uzumNote");
if (CONFIG.uzumShop) { ub.href = CONFIG.uzumShop; ub.hidden = false; un.href = CONFIG.uzumShop; }
[ub, un].forEach(a => a.addEventListener("click", e => { if (tg && tg.openLink) { e.preventDefault(); tg.openLink(a.href); } }));
render();
</script>

</body>
</html>
