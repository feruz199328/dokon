<head>
<meta charset="utf-8">

<meta name="theme-color" content="#F3F4F8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Onest:wght@400;500;600;700&display=swap">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: ilova uslubidagi do'kon — yopishqoq yuqori panel, siyoh rangli banner, qidiruv + rangli toifa chiplari, "Mashhur" gorizontal lenta, 2/3 ustunli katalog, pastdan chiqadigan tovar oynasi */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#111733; --ink-2:#2A3150; --muted:#666E8A; --line:#E3E6EF;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --hot:#E5484D; --ok:#12A150; --marker:#FFD43B;
  --t1:#2F5BEA; --b1:#E8EEFF; --t2:#E5484D; --b2:#FFEBEA; --t3:#12A150; --b3:#E2F6E9;
  --t4:#C77700; --b4:#FFF2D4; --t5:#7C4DDB; --b5:#F0E9FF; --t6:#0E8F9C; --b6:#DEF4F5;
  --shadow:0 1px 2px rgba(17,23,51,.06),0 8px 24px -12px rgba(17,23,51,.18);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F1E; --surface:#141A2E; --ink:#EEF1FA; --ink-2:#C9CFE3; --muted:#949CB7; --line:#232B45;
  --accent:#7B9BFF; --accent-ink:#0B0F1E; --hot:#FF6B70; --ok:#3CCB7F; --marker:#FFD43B;
  --t1:#8FA9FF; --b1:#1A2447; --t2:#FF8A8E; --b2:#3A1C24; --t3:#5BD993; --b3:#14301F;
  --t4:#FFC24D; --b4:#33270E; --t5:#B79BFF; --b5:#2A1E47; --t6:#4FD3DE; --b6:#10303A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F1E; --surface:#141A2E; --ink:#EEF1FA; --ink-2:#C9CFE3; --muted:#949CB7; --line:#232B45;
  --accent:#7B9BFF; --accent-ink:#0B0F1E; --hot:#FF6B70; --ok:#3CCB7F; --marker:#FFD43B;
  --t1:#8FA9FF; --b1:#1A2447; --t2:#FF8A8E; --b2:#3A1C24; --t3:#5BD993; --b3:#14301F;
  --t4:#FFC24D; --b4:#33270E; --t5:#B79BFF; --b5:#2A1E47; --t6:#4FD3DE; --b6:#10303A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:880px;margin:0 auto;display:grid;gap:10px}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;position:relative;flex:none;font:800 21px/1 var(--display)}
.mark svg{position:absolute;right:-3px;top:-4px;width:18px;height:18px}
.brand b{font:800 19px/1.1 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uzbtn{display:inline-flex;align-items:center;gap:7px;flex:none;text-decoration:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);font:600 13px var(--body);padding:8px 12px;border-radius:999px;box-shadow:var(--shadow)}
.uzbtn i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:12px 0;outline:none}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 13px var(--body);padding:7px 12px 7px 8px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip .dot{width:20px;height:20px;border-radius:7px;background:var(--tint,var(--b1));display:grid;place-items:center;color:var(--tone,var(--t1))}
.chip .dot svg{width:13px;height:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .dot{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}

/* hero */
.hero{position:relative;overflow:hidden;margin-top:14px;border-radius:24px;background:var(--ink);color:var(--bg);padding:22px 20px 20px;display:grid;gap:10px;isolation:isolate}
:root .hero{background:#111733;color:#F3F4F8}
.hero .kick{font:700 11.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#AFC0FF}
.hero h1{margin:0;font:800 clamp(26px,7vw,40px)/1.02 var(--display);letter-spacing:-.02em;max-width:15ch;text-wrap:balance}
.hero h1 em{font-style:normal;white-space:nowrap;display:inline-block;color:#111733;background:var(--marker);padding:0 .16em .04em;border-radius:.18em;transform:rotate(-1.5deg);margin-top:.08em}
.hero p{margin:0;color:#C9D2F2;max-width:34ch;font-size:14px}
.perks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.perks span{font:600 12px var(--body);padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.09);color:#E8ECFA;border:1px solid rgba(255,255,255,.12)}
.perks span b{color:#7EE2A8;font-weight:700}
.stickers{position:absolute;right:-8px;top:12px;width:44%;max-width:300px;height:calc(100% - 12px);z-index:-1;pointer-events:none}
.stk{position:absolute;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.stk svg{width:34px;height:34px}
.stk.s1{background:#2F5BEA;color:#fff;right:18%;top:2%;transform:rotate(-10deg)}
.stk.s2{background:#FFD43B;color:#111733;right:2%;top:34%;transform:rotate(9deg)}
.stk.s3{background:#E5484D;color:#fff;right:30%;top:48%;transform:rotate(6deg);width:56px;height:56px}
.stk.s4{background:#12A150;color:#fff;right:8%;bottom:4%;transform:rotate(-6deg);width:52px;height:52px}
@media (max-width:560px){
  .stickers{width:104px;height:64px;right:14px;top:14px}
  .stk{width:44px;height:44px;border-radius:13px}.stk svg{width:24px;height:24px}
  .stk.s1{right:52px;top:2px}.stk.s2{right:0;top:12px}.stk.s3,.stk.s4{display:none}
  .hero{padding-top:20px}.hero .kick{padding-right:110px}
}
@media (prefers-reduced-motion:no-preference){
  .stk{animation:bob 6s ease-in-out infinite}
  .stk.s2{animation-delay:-1.5s}.stk.s3{animation-delay:-3s}.stk.s4{animation-delay:-4.5s}
  @keyframes bob{50%{translate:0 -5px}}
}

/* sections */
.sec{margin-top:22px;display:grid;gap:12px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sech h2{margin:0;font:800 20px/1.1 var(--display);letter-spacing:-.01em}
.sech .count{color:var(--muted);font:500 13px var(--body);font-variant-numeric:tabular-nums}
.sort{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:7px 10px;border-radius:10px}

/* rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(46%,200px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .18s ease,box-shadow .18s ease}
.card:active{transform:scale(.98)}
@media (hover:hover){.card:hover{transform:translateY(-2px)}}
.card:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--tint,var(--b1));color:var(--tone,var(--t1));display:grid;place-items:center;overflow:hidden}
.tile::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:var(--surface);opacity:.55;right:-22%;top:-22%}
.tile::after{content:"";position:absolute;width:46%;aspect-ratio:1;border-radius:50%;background:var(--tone,var(--t1));opacity:.10;left:-12%;bottom:-14%}
.tile svg{position:relative;width:44%;height:auto;z-index:1}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.badge-tag{position:absolute;left:10px;top:10px;z-index:3;font:700 11px var(--body);color:#fff;background:var(--hot);padding:4px 8px;border-radius:8px}
.lbl{position:absolute;left:10px;bottom:10px;z-index:3;font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--tone,var(--t1));background:var(--surface);padding:4px 7px;border-radius:7px;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{padding:11px 12px 12px;display:grid;gap:3px;flex:1;min-width:0;align-content:start}
.cn{font-weight:600;font-size:14.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em}
.cf{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.price small{font:500 11.5px var(--body);color:var(--muted);letter-spacing:0}
.go{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.go svg{width:15px;height:15px}
.st{font:600 11.5px var(--body);display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st.on{color:var(--ok)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:44px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* footer */
.foot{margin-top:28px;display:grid;gap:10px;justify-items:center;text-align:center;color:var(--muted);font-size:12.5px}
.foot a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--marker)}

/* sheet */
.shade{position:fixed;inset:0;background:rgba(8,11,24,.5);z-index:20;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;max-width:880px;margin:0 auto;box-shadow:0 -20px 60px -20px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.9,.25,1)}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
.sheet .tile{aspect-ratio:16/10;border-radius:0}
.sheet .tile svg{width:30%}
.grab{position:absolute;left:50%;top:8px;translate:-50% 0;width:42px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);z-index:4}
.x{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:14px;z-index:4;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.sbody{padding:18px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sbody h2{margin:0;font:800 24px/1.12 var(--display);letter-spacing:-.015em;text-wrap:balance}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bigprice{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigprice small{font:500 14px var(--body);color:var(--muted);letter-spacing:0}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font:600 12px var(--body);border-radius:8px;padding:5px 9px;background:var(--bg);color:var(--ink-2)}
.meta span.g{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.desc{margin:0;color:var(--ink-2);max-width:65ch}
.ben h3{margin:4px 0 8px;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ben ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ben li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.ben li i{width:22px;height:22px;border-radius:50%;background:var(--tint,var(--b1));color:var(--tone,var(--t1));display:grid;place-items:center}
.ben li i svg{width:12px;height:12px}
.sfoot{position:sticky;bottom:0;background:linear-gradient(to top,var(--surface) 78%,transparent);padding:14px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font:700 15px var(--body);padding:15px 16px;border-radius:15px;border:1px solid transparent;cursor:pointer}
.btn.uz{background:#7000FF;color:#fff}
.btn.pr{background:var(--accent);color:var(--accent-ink)}
.btn.gh{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.off{background:var(--bg);color:var(--muted);cursor:default}
.hint{font-size:12.5px;color:var(--muted);text-align:center}
.pv{position:sticky;top:0;z-index:30;background:#B45309;color:#fff;font:600 13px var(--body);text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-in">
      <div class="bar1">
        <div class="brand">
          <div class="mark" aria-hidden="true"><span id="logoLetter">U</span><svg viewBox="0 0 24 24" fill="none" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 5"/></svg></div>
          <div style="min-width:0"><b id="shopName">Ustoz Do'koni</b><small id="shopTag">O'qituvchilar uchun dars qurollari</small></div>
        </div>
        <a class="uzbtn" id="uzumShopBtn" href="#" target="_blank" rel="noopener" hidden><i aria-hidden="true"></i>Uzum'da</a>
      </div>
      <label class="search" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Qidirish" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Toifalar"></div>
    </div>
  </header>

  <section class="hero" id="hero" aria-labelledby="heroTitle">
    <div class="kick" id="heroKicker"></div>
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <div class="perks" id="perks"></div>
    <div class="stickers" aria-hidden="true">
      <div class="stk s1" data-ico="cards"></div><div class="stk s2" data-ico="stationery"></div>
      <div class="stk s3" data-ico="games"></div><div class="stk s4" data-ico="audio"></div>
    </div>
  </section>

  <section class="sec" id="popSec" aria-labelledby="popTitle">
    <div class="sech"><h2 id="popTitle"></h2></div>
    <div class="rail" id="rail"></div>
  </section>

  <section class="sec" aria-labelledby="allTitle">
    <div class="sech">
      <h2 id="allTitle"></h2>
      <select class="sort" id="sort" aria-label="Saralash">
        <option value="pop">Mashhurlari</option>
        <option value="asc">Arzonidan</option>
        <option value="desc">Qimmatidan</option>
      </select>
    </div>
    <div class="sech" style="margin-top:-6px"><span class="count" id="count"></span></div>
    <main class="grid" id="grid"></main>
  </section>

  <footer class="foot" id="foot"></footer>
</div>

<div class="shade" id="shade" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle"></section>

<script>

let T = {}, S = {}, PRODUCTS = [], CATS = [], TONE = {};
let state = {cat:"all", q:"", sort:"pop"};
try { const s = JSON.parse(localStorage.getItem("ustoz-ui") || "{}"); if (s.sort) state.sort = s.sort; } catch(e){}
function saveUI(){ try { localStorage.setItem("ustoz-ui", JSON.stringify({sort:state.sort})); } catch(e){} }
const tone = cat => TONE[cat] || 1;
const toneStyle = cat => `--tone:var(--t${tone(cat)});--tint:var(--b${tone(cat)})`;
const icon = cat => ICONS[cat] || ICONS.cards;

document.querySelectorAll(".stk").forEach(el => el.innerHTML = ICONS[el.dataset.ico]);

function openExternal(e){
  const a = e.currentTarget;
  if (!tg) return;
  e.preventDefault();
  if (a.href.startsWith("https://t.me/") && tg.openTelegramLink) tg.openTelegramLink(a.href); else if (tg.openLink) tg.openLink(a.href);
}

function applyData(data){
  T = Object.assign({}, FALLBACK.texts, data.texts || {}); S = Object.assign({}, FALLBACK.shop, data.shop || {});
  PRODUCTS = (data.products || []).filter(p => !p.hidden).map((p, i) => Object.assign({pop:i}, p));
  const cats = data.categories || [];
  TONE = {}; cats.forEach((c, i) => TONE[c.id] = (i % 6) + 1);
  CATS = [{id:"all", name:"Hammasi"}].concat(cats.filter(c => PRODUCTS.some(p => p.cat === c.id)));
  if (!CATS.some(c => c.id === state.cat)) state.cat = "all";

  document.title = S.name;
  $("shopName").textContent = S.name; $("shopTag").textContent = S.tagline;
  $("logoLetter").textContent = S.logoLetter || (S.name || "U").charAt(0);
  $("q").placeholder = T.searchPlaceholder;
  $("heroKicker").textContent = T.heroKicker;
  $("heroTitle").innerHTML = `${esc(T.heroTitle)} <em>${esc(T.heroAccent)}</em>`;
  $("heroSub").textContent = T.heroSub;
  $("perks").innerHTML = `<span><b>✓</b> ${esc(T.uzumMeta)}</span><span><b>✓</b> ${esc(T.nasiyaMeta)}</span><span><b>✓</b> ${PRODUCTS.length} ta tovar</span>`;
  $("popTitle").textContent = T.popularTitle; $("allTitle").textContent = T.allTitle;

  const ub = $("uzumShopBtn");
  if (S.uzumShop) { ub.href = S.uzumShop; ub.hidden = false; ub.onclick = openExternal; } else ub.hidden = true;
  const tgUrl = S.telegramAdmin ? "https://t.me/" + S.telegramAdmin : "";
  $("foot").innerHTML = `${tgUrl ? `<div>Savollar bo'yicha: <a href="${esc(tgUrl)}" target="_blank" rel="noopener">@${esc(S.telegramAdmin)}</a></div>` : ""}
    ${S.uzumShop ? `<div>${esc(T.noteBefore)} <a href="${esc(S.uzumShop)}" target="_blank" rel="noopener">${esc(T.noteLink)}</a> ${esc(T.noteAfter)}</div>` : ""}
    <div>${esc(T.footer)}</div>`;
  $("foot").querySelectorAll("a").forEach(a => a.addEventListener("click", openExternal));

  $("chips").innerHTML = CATS.map(c => `<button class="chip" type="button" data-id="${esc(c.id)}" style="${c.id === "all" ? "" : toneStyle(c.id)}"><span class="dot">${c.id === "all" ? ICONS.all : icon(c.id)}</span>${esc(c.name)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { state.cat = b.dataset.id; render(); }));
  render();
}

function tileHTML(p, big){
  const art = p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : icon(p.cat);
  return `<div class="tile" style="${toneStyle(p.cat)}">${art}${p.tag ? `<span class="badge-tag">${esc(p.tag)}</span>` : ""}${!big && p.label ? `<span class="lbl">${esc(p.label)}</span>` : ""}</div>`;
}
function statusHTML(p){
  if (p.type === "order") return `<span class="st on"><i></i>${esc(T.orderMeta)}</span>`;
  return p.uzum ? `<span class="st on"><i></i>${esc(T.badgeUzum)}</span>` : `<span class="st"><i></i>${esc(T.badgeSoon)}</span>`;
}
function cardHTML(p){
  return `<button class="card" type="button" data-id="${esc(p.id)}" aria-label="${esc(p.name)}, ${fmt(p.price)} so'm">
    ${tileHTML(p)}
    <div class="cb">
      <div class="cn">${esc(p.name)}</div>
      <div class="cf">${esc(p.for)}</div>
      ${statusHTML(p)}
      <div class="cp"><div class="price">${p.type === "order" ? "<small>dan </small>" : ""}${fmt(p.price)} <small>so'm</small></div><span class="go" aria-hidden="true">${ARROW}</span></div>
    </div></button>`;
}
function bind(root){ root.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => open(c.dataset.id))); }

function render(){
  $("chips").querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === state.cat ? "true" : "false"));
  const q = state.q.trim().toLowerCase();
  const showRail = state.cat === "all" && !q;
  $("popSec").hidden = !showRail; $("hero").hidden = !!q;
  if (showRail) { $("rail").innerHTML = PRODUCTS.slice(0, 6).map(cardHTML).join(""); bind($("rail")); }
  let list = PRODUCTS.filter(p => (state.cat === "all" || p.cat === state.cat) && (!q || [p.name, p.label, p.for, p.desc].join(" ").toLowerCase().includes(q)));
  if (state.sort === "asc") list.sort((a,b) => a.price - b.price);
  else if (state.sort === "desc") list.sort((a,b) => b.price - a.price);
  else list.sort((a,b) => a.pop - b.pop);
  const cat = CATS.find(c => c.id === state.cat);
  $("allTitle").textContent = q ? `«${state.q.trim()}»` : (state.cat === "all" ? T.allTitle : cat.name);
  $("count").textContent = list.length + " ta tovar";
  $("grid").innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="empty">${esc(T.emptySearch)}</div>`;
  bind($("grid"));
}

function tgLink(text){ return "https://t.me/" + S.telegramAdmin + (text ? "?text=" + encodeURIComponent(text) : ""); }
const sheet = $("sheet"), shade = $("shade");
let lastFocus = null;
function open(id){
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  lastFocus = document.activeElement;
  let actions;
  if (p.type === "order") {
    actions = `<a class="btn pr" href="${esc(tgLink(`Assalomu alaykum! "${p.name}" buyurtma qilmoqchiman. Soni: __ ta. Logomizni yuboraman.`))}" target="_blank" rel="noopener">${esc(T.orderBtn)}</a>`;
  } else if (p.uzum) {
    actions = `<a class="btn uz" href="${esc(p.uzum)}" target="_blank" rel="noopener">${esc(T.buyBtn)}</a>
      <a class="btn gh" href="${esc(tgLink(`Assalomu alaykum! "${p.name}" haqida savolim bor.`))}" target="_blank" rel="noopener">${esc(T.askBtn)}</a>`;
  } else {
    actions = `<a class="btn pr" href="${esc(tgLink(`Assalomu alaykum! "${p.name}" Uzum'ga chiqqanda xabar bering, olmoqchiman.`))}" target="_blank" rel="noopener">${esc(T.notifyBtn)}</a>
      <div class="hint">${esc(T.soonHint)}</div>`;
  }
  const meta = p.type === "order" ? `<span class="g">${esc(T.orderMeta)}</span>` : (p.uzum ? `<span class="g">${esc(T.uzumMeta)}</span><span>${esc(T.nasiyaMeta)}</span>` : `<span>${esc(T.soonBtn)}</span>`);
  sheet.innerHTML = `
    <div class="grab" aria-hidden="true"></div>
    <button class="x" type="button" id="close" aria-label="${esc(T.closeBtn)}">${XICON}</button>
    ${tileHTML(p, true)}
    <div class="sbody" style="${toneStyle(p.cat)}">
      <div class="meta">${p.for ? `<span>${esc(p.for)}</span>` : ""}${meta}</div>
      <h2 id="sTitle">${esc(p.name)}</h2>
      <div class="bigprice">${p.type === "order" ? "<small>dan </small>" : ""}${fmt(p.price)} <small>so'm${p.unit ? " / " + esc(p.unit) : ""}</small></div>
      ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
      ${(p.points || []).length ? `<div class="ben"><h3>${esc(T.benefitsTitle)}</h3><ul>${p.points.map(x => `<li><i>${CHECK}</i><span>${esc(x)}</span></li>`).join("")}</ul></div>` : ""}
    </div>
    <div class="sfoot">${actions}</div>`;
  sheet.hidden = false; shade.hidden = false; sheet.scrollTop = 0;
  document.body.style.overflow = "hidden";
  $("close").addEventListener("click", close);
  sheet.querySelectorAll('a[href^="http"]').forEach(a => a.addEventListener("click", openExternal));
  $("close").focus();
  if (tg && tg.BackButton) { try { tg.BackButton.show(); tg.BackButton.onClick(close); } catch(e){} }
}
function close(){
  sheet.hidden = true; shade.hidden = true; document.body.style.overflow = "";
  if (tg && tg.BackButton) { try { tg.BackButton.offClick(close); tg.BackButton.hide(); } catch(e){} }
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
shade.addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) close(); });
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("sort").value = state.sort;
$("sort").addEventListener("change", e => { state.sort = e.target.value; saveUI(); render(); });

applyData(FALLBACK);
let preview = null;
if (/[?&]preview=1/.test(location.search)) { try { preview = JSON.parse(localStorage.getItem("ustoz-preview") || "null"); } catch(e){} }
if (preview && preview.products) {
  applyData(preview);
  const bar = document.createElement("div"); bar.className = "pv"; bar.setAttribute("role", "status");
  bar.textContent = "Oldindan ko'rish — buni faqat siz ko'ryapsiz. Mijozlar ko'rishi uchun admin panelda «Saqlash»ni bosing.";
  document.body.prepend(bar);
} else {
  fetch("data.json?t=" + Date.now(), {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(d => { if (d && d.products) applyData(d); }).catch(() => {});
}
</script>
