<style>
/* Mijoz oynasi — premium katalog: shisha yuqori panel, siyoh-ko'k banner, toifa chiplari, mashhur lenta, katalog, pastdan chiqadigan tovar oynasi */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#F8F9FC; --ink:#0D1230; --ink-2:#2B3254; --muted:#6A7290; --line:#E4E7F0; --line-2:#EEF0F6;
  --accent:#3550F0; --accent-2:#6B4CF6; --accent-ink:#FFFFFF; --gold:#F6C453; --gold-ink:#2A1E00; --hot:#EF4565; --ok:#0FA968; --uz:#7000FF;
  --t1:#3550F0; --b1:#E9EDFF; --t2:#E0475F; --b2:#FFECEF; --t3:#0F9F63; --b3:#E1F6EC;
  --t4:#C27A00; --b4:#FFF3D6; --t5:#7A4DE0; --b5:#F1EAFF; --t6:#0B8FA0; --b6:#DFF4F6;
  --sh-1:0 1px 2px rgba(13,18,48,.05);
  --sh-2:0 1px 2px rgba(13,18,48,.05),0 10px 30px -14px rgba(13,18,48,.22);
  --sh-3:0 2px 6px rgba(13,18,48,.06),0 24px 50px -20px rgba(13,18,48,.35);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080B1A; --surface:#11162B; --surface-2:#161C35; --ink:#EEF1FB; --ink-2:#C6CCE4; --muted:#8F98B8; --line:#222A47; --line-2:#1A2140;
  --accent:#7D92FF; --accent-2:#A58BFF; --accent-ink:#080B1A; --gold:#F6C453; --hot:#FF6F86; --ok:#35D08D;
  --t1:#8EA2FF; --b1:#18214A; --t2:#FF8A9C; --b2:#3A1824; --t3:#4FD797; --b3:#102E22; --t4:#FFC54F; --b4:#33260B; --t5:#B89BFF; --b5:#271B48; --t6:#4FD2E0; --b6:#0E2E36;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.8); --sh-3:0 2px 6px rgba(0,0,0,.4),0 30px 60px -24px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080B1A; --surface:#11162B; --surface-2:#161C35; --ink:#EEF1FB; --ink-2:#C6CCE4; --muted:#8F98B8; --line:#222A47; --line-2:#1A2140;
  --accent:#7D92FF; --accent-2:#A58BFF; --accent-ink:#080B1A; --gold:#F6C453; --hot:#FF6F86; --ok:#35D08D;
  --t1:#8EA2FF; --b1:#18214A; --t2:#FF8A9C; --b2:#3A1824; --t3:#4FD797; --b3:#102E22; --t4:#FFC54F; --b4:#33260B; --t5:#B89BFF; --b5:#271B48; --t6:#4FD2E0; --b6:#0E2E36;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.8); --sh-3:0 2px 6px rgba(0,0,0,.4),0 30px 60px -24px rgba(0,0,0,.9);
  color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:12px}
.wrap{max-width:960px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== yuqori panel ===== */
.top{position:sticky;top:0;z-index:10;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);transition:box-shadow .25s}
.top.scrolled{box-shadow:0 1px 0 var(--line)}
.top-in{max-width:960px;margin:0 auto;display:grid;gap:10px}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:40px;height:40px;border-radius:13px;flex:none;position:relative;display:grid;place-items:center;color:#fff;font:800 22px/1 var(--display);
  background:linear-gradient(135deg,#4561FF,#6B4CF6);box-shadow:0 6px 16px -6px rgba(69,97,255,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.mark svg{position:absolute;right:-4px;top:-5px;width:19px;height:19px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.brand b{display:block;font:800 19px/1.1 var(--display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;flex:none}
.pillbtn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);font:600 13px var(--body);padding:8px 12px;border-radius:999px;box-shadow:var(--sh-1);cursor:pointer;white-space:nowrap}
.pillbtn .live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.pillbtn.seller{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pillbtn svg{width:15px;height:15px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:0 6px 0 13px;box-shadow:var(--sh-1);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:12px 0;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.qx{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 13px var(--body);padding:6px 13px 6px 6px;border-radius:999px;cursor:pointer;transition:background .2s var(--ease),color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip .dot{width:24px;height:24px;border-radius:999px;background:var(--tint,var(--b1));display:grid;place-items:center;color:var(--tone,var(--t1));transition:background .2s}
.chip .dot svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .dot{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}

/* ===== banner ===== */
.hero{position:relative;overflow:hidden;margin-top:12px;border-radius:28px;color:#F4F6FF;padding:24px 22px 20px;isolation:isolate;
  background:radial-gradient(120% 90% at 100% 0%,#5B47F5 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#1E3BE0 0%,transparent 60%),#0B1030;box-shadow:var(--sh-3)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;
  -webkit-mask-image:radial-gradient(80% 80% at 80% 20%,#000,transparent);mask-image:radial-gradient(80% 80% at 80% 20%,#000,transparent)}
.hero-in{display:grid;gap:12px;max-width:520px}
.kick{display:inline-flex;align-items:center;gap:8px;width:max-content;max-width:100%;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#D9DEFF;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 11px;border-radius:999px}
.kick i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.hero h1{margin:0;font:800 clamp(30px,8vw,46px)/1 var(--display);letter-spacing:-.03em;text-wrap:balance}
.hero h1 em{font-style:normal;white-space:nowrap;color:var(--gold);position:relative}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:-.06em;height:.12em;border-radius:1em;background:linear-gradient(90deg,var(--gold),#FF9F43);opacity:.9}
.hero p{margin:0;color:#BFC7EE;max-width:36ch;font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 11px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stat b{display:block;font:800 19px/1.05 var(--display);letter-spacing:-.01em;color:#fff;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:#AEB7E6;line-height:1.25;margin-top:3px}
.art{position:absolute;right:-14px;top:-10px;width:46%;max-width:330px;aspect-ratio:1;z-index:-1;pointer-events:none}
.orb{position:absolute;border-radius:24px;display:grid;place-items:center;box-shadow:0 18px 30px -12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.orb svg{width:52%;height:52%}
.orb.o1{width:30%;aspect-ratio:1;background:linear-gradient(140deg,#5D79FF,#3550F0);color:#fff;right:40%;top:18%;transform:rotate(-12deg)}
.orb.o2{width:26%;aspect-ratio:1;background:linear-gradient(140deg,#FFD978,#F6B23C);color:#3A2A00;right:12%;top:30%;transform:rotate(10deg)}
.orb.o3{width:22%;aspect-ratio:1;background:linear-gradient(140deg,#FF7C93,#E33E5D);color:#fff;right:34%;top:54%;transform:rotate(8deg)}
.orb.o4{width:20%;aspect-ratio:1;background:linear-gradient(140deg,#3EE0A0,#0FA968);color:#fff;right:8%;top:62%;transform:rotate(-8deg)}
@media (max-width:600px){
  .art{width:150px;right:-18px;top:-6px}
  .orb.o3,.orb.o4{display:none}.orb.o1{width:44%;right:44%;top:20%}.orb.o2{width:38%;right:14%;top:40%}
  .kick{margin-right:110px}
}
@media (prefers-reduced-motion:no-preference){
  .orb{animation:float 7s ease-in-out infinite}.orb.o2{animation-delay:-2s}.orb.o3{animation-delay:-4s}.orb.o4{animation-delay:-5.5s}
  @keyframes float{50%{translate:0 -7px}}
}

/* ===== ishonch qatori ===== */
.trust{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:0 max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none}
.trust::-webkit-scrollbar{display:none}
.tr{display:grid;grid-template-columns:40px 1fr;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:11px 13px;box-shadow:var(--sh-1)}
.tr i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--b,var(--b1));color:var(--c,var(--t1))}
.tr i svg{width:20px;height:20px}
.tr b{display:block;font-size:13.5px;line-height:1.2}
.tr span{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:1px}

/* ===== bo'limlar ===== */
.sec{margin-top:26px;display:grid;gap:12px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sech h2{margin:0;font:800 22px/1.1 var(--display);letter-spacing:-.02em}
.sech .count{display:block;color:var(--muted);font:500 13px var(--body);margin-top:3px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;box-shadow:var(--sh-1)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 12.5px var(--body);padding:6px 10px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(46%,210px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:16px}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:660px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ===== kartochka ===== */
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line-2);box-shadow:var(--sh-2);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card:active{transform:scale(.975)}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}}
.card:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.tile{position:relative;aspect-ratio:1/1;background:linear-gradient(160deg,var(--tint,var(--b1)),color-mix(in srgb,var(--tint,var(--b1)) 60%,var(--surface)));color:var(--tone,var(--t1));display:grid;place-items:center;overflow:hidden}
.tile::before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--surface) 80%,transparent),transparent 70%);right:-18%;top:-22%}
.tile svg{position:relative;width:42%;height:auto;z-index:1;filter:drop-shadow(0 8px 12px color-mix(in srgb,var(--tone,var(--t1)) 30%,transparent))}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;opacity:0;transition:opacity .4s}
.tile img.ld{opacity:1}
.tag{position:absolute;left:10px;top:10px;z-index:3;font:700 11px var(--body);color:#fff;background:linear-gradient(135deg,#FF6A85,#E33E5D);padding:4px 9px;border-radius:999px;box-shadow:0 4px 10px -4px rgba(227,62,93,.7)}
.lbl{position:absolute;left:10px;bottom:10px;z-index:3;font:700 9.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--tone,var(--t1));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px 8px;border-radius:999px;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{padding:11px 12px 12px;display:grid;gap:4px;flex:1;min-width:0;align-content:start}
.st{font:600 11.5px var(--body);display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.st.on{color:var(--ok)}
.cn{font-weight:600;font-size:14.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em}
.cf{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.015em;white-space:nowrap}
.price small{font:500 11.5px var(--body);color:var(--muted);letter-spacing:0}
.go{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform .25s var(--ease)}
.go svg{width:15px;height:15px}
@media (hover:hover){.card:hover .go{transform:translateX(2px) rotate(-45deg)}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:grid;gap:12px;justify-items:center}
.empty button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}

/* ===== pastki qism ===== */
.cta{margin-top:30px;border-radius:24px;padding:20px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--sh-2)}
.cta h3{margin:0;font:800 19px/1.15 var(--display);letter-spacing:-.01em}
.cta p{margin:0;color:var(--muted);font-size:14px}
.cta .row{display:flex;gap:8px;flex-wrap:wrap}
.foot{margin-top:22px;display:grid;gap:6px;justify-items:center;text-align:center;color:var(--muted);font-size:12.5px}
.foot a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--gold)}

/* ===== tugmalar ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;font:700 15px var(--body);padding:15px 18px;border-radius:16px;border:1px solid transparent;cursor:pointer;transition:transform .15s,filter .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex:none}
.btn.uz{background:linear-gradient(135deg,#8A2BFF,#6A00F4);color:#fff;box-shadow:0 10px 24px -10px rgba(112,0,255,.8)}
.btn.pr{background:linear-gradient(135deg,#4F6BFF,#3550F0);color:#fff;box-shadow:0 10px 24px -10px rgba(53,80,240,.8)}
.btn.gh{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:10px 14px;font-size:13.5px;border-radius:12px}
.hint{font-size:12.5px;color:var(--muted);text-align:center}

/* ===== tovar oynasi ===== */
.shade{position:fixed;inset:0;background:rgba(5,8,22,.55);z-index:30;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .25s}
.shade.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:28px 28px 0 0;max-height:94%;overflow-y:auto;overscroll-behavior:contain;max-width:720px;margin:0 auto;box-shadow:0 -24px 70px -20px rgba(0,0,0,.45);
  transform:translateY(100%);transition:transform .38s var(--ease)}
.sheet.on{transform:none}
@media (min-width:760px){.sheet{bottom:auto;top:50%;border-radius:28px;max-height:90vh;transform:translateY(-46%) scale(.97);opacity:0;transition:transform .3s var(--ease),opacity .25s}.sheet.on{transform:translateY(-50%);opacity:1}}
.sheet .tile{aspect-ratio:16/11}
.sheet .tile svg{width:30%}
.grab{position:absolute;left:50%;top:9px;translate:-50% 0;width:44px;height:5px;border-radius:3px;background:rgba(0,0,0,.2);z-index:4}
.sx{position:absolute;top:14px;z-index:4;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh-2)}
.sx.close{right:14px}.sx.share{right:62px}
.sx svg{width:18px;height:18px}
.sbody{padding:18px 20px 6px;display:grid;gap:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font:600 12px var(--body);border-radius:999px;padding:5px 10px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}

.sbody h2{margin:0;font:800 25px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}
.bigprice{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.025em}

.desc{margin:0;color:var(--ink-2);max-width:62ch}
.ben{background:var(--surface-2);border:1px solid var(--line-2);border-radius:18px;padding:14px}

.ben ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ben li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.ben li i{width:22px;height:22px;border-radius:50%;background:var(--tint,var(--b1));color:var(--tone,var(--t1));display:grid;place-items:center}
.ben li i svg{width:12px;height:12px}
.rel h3{margin:6px 0 10px;font:800 17px var(--display)}
.rel .rail{grid-auto-columns:min(42%,170px)}
.rel .cn{font-size:13.5px}
.sfoot{position:sticky;bottom:0;background:linear-gradient(to top,var(--surface) 80%,color-mix(in srgb,var(--surface) 0%,transparent));padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;translate:-50% 20px;opacity:0;background:var(--ink);color:var(--bg);font:600 13.5px var(--body);padding:11px 16px;border-radius:999px;box-shadow:var(--sh-3);transition:opacity .25s,translate .25s var(--ease);pointer-events:none}

if (tg) {
  try {
    tg.ready(); tg.expand();
    if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg);
    tg.onEvent && tg.onEvent("themeChanged", () => { document.documentElement.dataset.theme = tg.colorScheme; });
  } catch(e){}
}

let T = {}, S = {}, PRODUCTS = [], CATS = [], TONE = {};
let state = Object.assign({cat:"all", q:"", sort:"pop"}, {sort:(store.get("ustoz-ui") || {}).sort || "pop"});
const tone = cat => TONE[cat] || 1;
const toneStyle = cat => `--tone:var(--t${tone(cat)});--tint:var(--b${tone(cat)})`;
const icon = cat => ICONS[cat] || ICONS.cards;
document.querySelectorAll(".orb").forEach(el => el.innerHTML = ICONS[el.dataset.ico]);
$("trust").innerHTML = TRUST.map(x => `<div class="tr" style="--c:${x.c};--b:${x.b}"><i aria-hidden="true">${x.i}</i><div><b>${x.t}</b><span>${x.s}</span></div></div>`).join("");

function openExternal(e){
  const a = e.currentTarget; haptic("medium");
  if (!tg) return;
  e.preventDefault();
  if (a.href.startsWith("https://t.me/") && tg.openTelegramLink) tg.openTelegramLink(a.href); else if (tg.openLink) tg.openLink(a.href);
}
const tgLink = text => "https://t.me/" + S.telegramAdmin + (text ? "?text=" + encodeURIComponent(text) : "");

function applyData(data){
  T = Object.assign({}, FALLBACK.texts, data.texts || {}); S = Object.assign({}, FALLBACK.shop, data.shop || {});
  PRODUCTS = (data.products || []).filter(p => !p.hidden).map((p, i) => Object.assign({pop:i}, p));
  const cats = data.categories || [];
  TONE = {}; cats.forEach((c, i) => TONE[c.id] = (i % 6) + 1);
  CATS = [{id:"all", name:"Hammasi"}].concat(cats.filter(c => PRODUCTS.some(p => p.cat === c.id)));
  if (!CATS.some(c => c.id === state.cat)) state.cat = "all";

  document.title = S.name;
  $("shopName").textContent = S.name; $("shopTag").textContent = S.tagline;
  $("logoLetter").textContent = S.logoLetter || (S.name || "U").charAt(0);
  $("q").placeholder = T.searchPlaceholder;
  $("heroKicker").textContent = T.heroKicker;
  $("heroTitle").innerHTML = `${esc(T.heroTitle)} <em>${esc(T.heroAccent)}</em>`;
  $("heroSub").textContent = T.heroSub;
  const onUzum = PRODUCTS.filter(p => p.uzum).length;
  const minP = PRODUCTS.length ? Math.min(...PRODUCTS.map(p => p.price || 0)) : 0;
  $("stats").innerHTML = `<div class="stat"><b>${PRODUCTS.length}</b><span>ta tovar</span></div>
    <div class="stat"><b>${onUzum ? onUzum : "Bepul"}</b><span>${onUzum ? "Uzum'da bor" : "yetkazish"}</span></div>
    <div class="stat"><b>${fmt(Math.round(minP / 1000))}k</b><span>so'mdan boshlab</span></div>`;
  $("popTitle").textContent = T.popularTitle;

  const ub = $("uzumShopBtn");
  if (S.uzumShop) { ub.href = S.uzumShop; ub.hidden = false; ub.onclick = openExternal; } else ub.hidden = true;
  const cb = $("ctaBtn"); cb.innerHTML = TGI + "Telegram'da yozish"; cb.href = tgLink("Assalomu alaykum! Menga kerakli tovar: ");
  cb.onclick = openExternal; $("cta").hidden = !S.telegramAdmin;
  $("foot").innerHTML = `${S.telegramAdmin ? `<div>Savollar: <a href="${esc(tgLink(""))}" target="_blank" rel="noopener">@${esc(S.telegramAdmin)}</a></div>` : ""}
    ${S.uzumShop ? `<div>${esc(T.noteBefore)} <a href="${esc(S.uzumShop)}" target="_blank" rel="noopener">${esc(T.noteLink)}</a> ${esc(T.noteAfter)}</div>` : ""}
    <div>${esc(T.footer)} · © ${new Date().getFullYear()} ${esc(S.name)}</div>`;
  $("foot").querySelectorAll("a").forEach(a => a.addEventListener("click", openExternal));

  /* Sotuvchi tugmasi: faqat do'kon egasining Telegram akkauntida ko'rinadi. Panelning o'zi baribir GitHub kalitini talab qiladi. */
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const isOwner = u && u.username && S.telegramAdmin && u.username.toLowerCase() === String(S.telegramAdmin).toLowerCase();
  $("sellerBtn").hidden = !(isOwner || /[?&]seller=1/.test(location.search));

  $("chips").innerHTML = CATS.map(c => `<button class="chip" type="button" data-id="${esc(c.id)}" style="${c.id === "all" ? "" : toneStyle(c.id)}"><span class="dot">${c.id === "all" ? ICONS.all : icon(c.id)}</span>${esc(c.name)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { haptic(); state.cat = b.dataset.id; render(); b.scrollIntoView({inline:"nearest", block:"nearest", behavior:"smooth"}); }));
  render();
}

function tileHTML(p, big){
  const art = p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ld')">` + icon(p.cat) : icon(p.cat);
  return `<div class="tile" style="${toneStyle(p.cat)}">${art}${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}${!big && p.label ? `<span class="lbl">${esc(p.label)}</span>` : ""}</div>`;
}
function statusHTML(p){
  if (p.type === "order") return `<span class="st on"><i></i>${esc(T.orderMeta)}</span>`;
  return p.uzum ? `<span class="st on"><i></i>${esc(T.badgeUzum)}</span>` : `<span class="st"><i></i>${esc(T.badgeSoon)}</span>`;
}
function cardHTML(p){
  return `<button class="card" type="button" data-id="${esc(p.id)}" aria-label="${esc(p.name)}, ${fmt(p.price)} so'm">
    ${tileHTML(p)}
    <div class="cb">
      ${statusHTML(p)}
      <div class="cn">${esc(p.name)}</div>
      <div class="cf">${esc(p.for)}</div>
      <div class="cp"><div class="price">${p.type === "order" ? "<small>dan </small>" : ""}${fmt(p.price)} <small>so'm</small></div><span class="go" aria-hidden="true">${ARROW}</span></div>
    </div></button>`;
}
function bind(root){ root.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => { haptic(); open(c.dataset.id); })); }

function render(){
  $("chips").querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === state.cat ? "true" : "false"));
  $("sort").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.sort ? "true" : "false"));
  const q = state.q.trim().toLowerCase();
  $("qx").hidden = !q;
  const home = state.cat === "all" && !q;
  $("popSec").hidden = !home; $("hero").hidden = !!q; $("trust").hidden = !home;
  if (home) { $("rail").innerHTML = PRODUCTS.slice(0, 8).map(cardHTML).join(""); bind($("rail")); }
  let list = PRODUCTS.filter(p => (state.cat === "all" || p.cat === state.cat) && (!q || [p.name, p.label, p.for, p.desc, (p.points || []).join(" ")].join(" ").toLowerCase().includes(q)));
  if (state.sort === "asc") list.sort((a,b) => a.price - b.price);
  else if (state.sort === "desc") list.sort((a,b) => b.price - a.price);
  else list.sort((a,b) => a.pop - b.pop);
  const cat = CATS.find(c => c.id === state.cat);
  $("allTitle").textContent = q ? `«${state.q.trim()}»` : (state.cat === "all" ? T.allTitle : cat.name);
  $("count").textContent = list.length + " ta tovar";
  $("grid").innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="empty"><div>${esc(T.emptySearch)}</div><button type="button" id="reset">Barcha tovarlarni ko'rsatish</button></div>`;
  bind($("grid"));
  const r = $("reset"); if (r) r.onclick = () => { state.q = ""; state.cat = "all"; $("q").value = ""; render(); };
}

/* ===== tovar oynasi ===== */
const sheet = $("sheet"), shade = $("shade");
let lastFocus = null, current = null;
function open(id, fromHash){
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  if (!current) lastFocus = document.activeElement;
  current = id;
  let actions;
  if (p.type === "order") {
    actions = `<a class="btn pr" href="${esc(tgLink(`Assalomu alaykum! "${p.name}" buyurtma qilmoqchiman. Soni: __ ta. Logomizni yuboraman.`))}" target="_blank" rel="noopener">${TGI}${esc(T.orderBtn)}</a>`;
  } else if (p.uzum) {
    actions = `<a class="btn uz" href="${esc(p.uzum)}" target="_blank" rel="noopener">${BAG}${esc(T.buyBtn)}</a>
      <a class="btn gh" href="${esc(tgLink(`Assalomu alaykum! "${p.name}" haqida savolim bor.`))}" target="_blank" rel="noopener">${TGI}${esc(T.askBtn)}</a>`;
  } else {
    actions = `<a class="btn pr" href="${esc(tgLink(`Assalomu alaykum! "${p.name}" Uzum'ga chiqqanda xabar bering, olmoqchiman.`))}" target="_blank" rel="noopener">${BELL}${esc(T.notifyBtn)}</a>
      <div class="hint">${esc(T.soonHint)}</div>`;
  }
  const meta = p.type === "order" ? `<span class="g">${esc(T.orderMeta)}</span>` : (p.uzum ? `<span class="g">${esc(T.uzumMeta)}</span><span>${esc(T.nasiyaMeta)}</span>` : `<span>${esc(T.soonBtn)}</span>`);
  const rel = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 6);
  sheet.innerHTML = `
    <div class="grab" aria-hidden="true"></div>
    <button class="sx share" type="button" id="share" aria-label="Ulashish">${SHARE}</button>
    <button class="sx close" type="button" id="close" aria-label="${esc(T.closeBtn)}">${XICON}</button>
    ${tileHTML(p, true)}
    <div class="sbody" style="${toneStyle(p.cat)}">
      <div class="meta">${p.for ? `<span>${esc(p.for)}</span>` : ""}${meta}</div>
      <h2 id="sTitle">${esc(p.name)}</h2>
      <div class="bigprice">${p.type === "order" ? "<small>dan </small>" : ""}${fmt(p.price)} <small>so'm${p.unit ? " / " + esc(p.unit) : ""}</small></div>
      ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ""}
      ${(p.points || []).length ? `<div class="ben"><h3>${esc(T.benefitsTitle)}</h3><ul>${p.points.map(x => `<li><i>${CHECK}</i><span>${esc(x)}</span></li>`).join("")}</ul></div>` : ""}
      ${rel.length ? `<div class="rel"><h3>Shu toifadan</h3><div class="rail" id="relRail">${rel.map(cardHTML).join("")}</div></div>` : ""}
    </div>
    <div class="sfoot">${actions}</div>`;
  const firstOpen = sheet.hidden;
  sheet.hidden = false; shade.hidden = false; sheet.scrollTop = 0;
  if (firstOpen) requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add("on"); shade.classList.add("on"); }));
  document.body.style.overflow = "hidden";
  $("close").addEventListener("click", close);
  $("share").addEventListener("click", () => share(p));
  sheet.querySelectorAll('a[href^="http"]').forEach(a => a.addEventListener("click", openExternal));
  const rr = $("relRail"); if (rr) bind(rr);
  if (!fromHash) history.replaceState(null, "", "#p=" + encodeURIComponent(p.id));
  $("close").focus({preventScroll:true});
  if (tg && tg.BackButton) { try { tg.BackButton.show(); tg.BackButton.offClick(close); tg.BackButton.onClick(close); } catch(e){} }
}
function close(){
  if (sheet.hidden) return;
  sheet.classList.remove("on"); shade.classList.remove("on");
  setTimeout(() => { sheet.hidden = true; shade.hidden = true; sheet.innerHTML = ""; }, 320);
  document.body.style.overflow = ""; current = null;
  history.replaceState(null, "", location.pathname + location.search);
  if (tg && tg.BackButton) { try { tg.BackButton.offClick(close); tg.BackButton.hide(); } catch(e){} }
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); }
async function share(p){
  haptic();
  const url = (p.uzum || (location.origin + location.pathname + "#p=" + encodeURIComponent(p.id)));
  const text = `${p.name} — ${fmt(p.price)} so'm`;
  if (tg && tg.openTelegramLink) { tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text)); return; }
  try { if (navigator.share) { await navigator.share({title:p.name, text, url}); return; } } catch(e){ return; }
  try { await navigator.clipboard.writeText(url); toast("Havola nusxalandi"); } catch(e){ toast(url); }
}
shade.addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; render(); }, 120); });
$("qx").addEventListener("click", () => { $("q").value = ""; state.q = ""; render(); $("q").focus(); });
$("sort").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { haptic(); state.sort = b.dataset.v; store.set("ustoz-ui", {sort:state.sort}); render(); }));
addEventListener("scroll", () => $("top").classList.toggle("scrolled", scrollY > 8), {passive:true});
function fromHash(){ const m = location.hash.match(/^#p=(.+)$/); if (m) open(decodeURIComponent(m[1]), true); }

/* ===== ma'lumotni yuklash =====
   20 000 kishi bir vaqtda kirganda ham ishlashi uchun:
   1) avval shu telefonda saqlangan oxirgi nusxa darhol ko'rsatiladi;
   2) data.json CDN keshidan olinadi (har daqiqada bitta yangi kalit) — server yuklanmaydi,
      admin o'zgartirgan narsa mijozlarga ~1–2 daqiqada yetib boradi. */
let preview = null;
if (/[?&]preview=1/.test(location.search)) preview = store.get("ustoz-preview");
if (preview && preview.products) {
  applyData(preview);
  const bar = document.createElement("div"); bar.className = "pv"; bar.setAttribute("role", "status");
  bar.textContent = "Oldindan ko'rish — buni faqat siz ko'ryapsiz. Mijozlar ko'rishi uchun panelda «Saqlash»ni bosing.";
  document.body.prepend(bar);
  fromHash();
} else {
  const cached = store.get("ustoz-data");
  applyData(cached && cached.products ? cached : FALLBACK);
  fromHash();
  const v = Math.floor(Date.now() / 60000);
  const load = (n) => fetch("data.json?v=" + v).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
    if (!d || !d.products) return;
    const s = JSON.stringify(d);
    if (!cached || JSON.stringify(cached) !== s) { store.set("ustoz-data", d); const keep = current; applyData(d); if (keep) open(keep, true); }
  }).catch(() => { if (n < 2) setTimeout(() => load(n + 1), 1500 * (n + 1) + Math.random() * 1500); });
  load(0);
}
</script>
</body>
</html>
